name: CI

on:
  pull_request:
  workflow_dispatch:

# A new commit to a PR cancels the superseded run so the latest build reuses
# the runner instead of queueing behind a stale one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the whitespace check can diff against the PR base
          # rather than the clean (and therefore always-empty) checkout.
          fetch-depth: 0

      - name: Check whitespace against PR base
        if: github.event_name == 'pull_request'
        run: git diff --check ${{ github.event.pull_request.base.sha }}...HEAD

      - name: Run SWIPRKit unit tests (macOS)
        run: Scripts/run-kit-tests.sh

      - name: Type-check the iOS app
        run: Scripts/typecheck-ios.sh

      - name: Run simulator test suite
        run: |
          xcodebuild test \
            -project SWIPR.xcodeproj \
            -scheme SWIPR \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -derivedDataPath ./.derivedData-simulator \
            -skip-testing:SWIPRUITests/PlaySessionUITests/testPlayEveryScreenAtTheLargestAccessibilityTextSize
